- type: entity
  parent: BaseGameRule
  id: BaseWerewolfRule
  components:
  - type: WerewolfRule
  - type: GameRule
    minPlayers: 20
  - type: AntagPlayerEffects
    effects:
    - !type:NestedEffect
      proto: WerewolfSkills
  - type: AntagSelection
    antags:
    - !type:LinearAntagCount
      proto: Werewolf
      range:
        min: 2
        max: 5
      playerRatio: 12
  - type: AntagObjectives
    objectives:
    - EscapeWerewolfShuttleObjective

- type: entity
  parent: [ BaseRoundstartAntagRule, BaseWerewolfRule ]
  id: WerewolfRoundstart
  components:
  - type: AntagSelection
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Werewolf
      range:
        min: 2
        max: 5
      playerRatio: 12
